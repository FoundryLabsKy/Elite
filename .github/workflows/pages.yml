name: Deploy websites to GitHub Pages

on:
  push:
    branches:
      - claude/code-skills-ux-frontend-i6654s
      - claude/cayman-craft-market-site-c0opgt
      - claude/skills-setup-lfydlo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site/craftmarket _site/wellys-cool-spot
          cp index.html _site/index.html
          cp robots.txt sitemap.xml _site/
          cp craftmarket/index.html _site/craftmarket/index.html
          cp wellys-cool-spot/index.html _site/wellys-cool-spot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
