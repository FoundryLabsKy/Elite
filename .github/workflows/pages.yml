name: Deploy websites to GitHub Pages

on:
  push:
    branches:
      - claude/code-skills-ux-frontend-i6654s
      - claude/cayman-craft-market-site-c0opgt
      - claude/website-build-audit-qa-ship-u9k5un
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for site in craftmarket larrys-hardware sand-angels forever-summer; do
            if [ -f "$site/index.html" ]; then
              mkdir -p "_site/$site"
              cp "$site/index.html" "_site/$site/index.html"
            fi
          done
          [ -f robots.txt ] && cp robots.txt _site/robots.txt
          [ -f sitemap.xml ] && cp sitemap.xml _site/sitemap.xml
          true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
